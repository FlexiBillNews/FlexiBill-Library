<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGNITE Arena — DOKU sales coaching</title>
<meta name="description" content="IGNITE Arena: internal sales coaching for DOKU. Learn the product, practise the pitch, run the demo and win the meeting.">
<meta name="theme-color" content="#E1251B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#E1251B;--red-d:#B51D15;--navy:#1B1E2B;--navy2:#272B3C;--teal:#00A69C;--gold:#C9A24B;--canvas:#F5F5F7;--ink:#1B1E2B;--muted:#5B6275;--line:#E3E5EA;--soft:#EEF0F3;--font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;font:400 17px/1.55 var(--font);color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px}.skip:focus{left:12px;z-index:200;background:#fff;padding:8px 12px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
svg.i{width:20px;height:20px;flex-shrink:0}
/* navigation */
#nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.84);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid rgba(27,30,43,.08)}
#nav .wrap{display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.brand img{width:30px;height:30px;border-radius:7px}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.015em;display:block;line-height:1.1}
.brand small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.links{display:flex;gap:2px;flex:1;justify-content:center;min-width:0}
.links a{text-decoration:none;font-size:14px;font-weight:600;color:var(--muted);padding:7px 10px;border-radius:9px;white-space:nowrap}
.links a:hover,.links a.on{color:var(--ink);background:var(--soft)}
.ctl{display:flex;gap:8px;align-items:center}
.sel{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-size:13.5px;font-weight:600;max-width:150px}
.ib{border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:36px;display:grid;place-items:center;color:var(--ink)}
.ib[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.menu-btn{display:none}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:15.5px;text-decoration:none;background:var(--soft);color:var(--ink);white-space:nowrap}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:var(--red-d)}
.btn.dark{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:8px 15px;font-size:14px}
.btn.lite{background:rgba(255,255,255,.12);color:#fff}
/* hero */
.hero{padding:76px 0 60px}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:center}
.hero h1{margin:0;font-weight:800;font-size:clamp(54px,7.6vw,108px);line-height:.96;letter-spacing:-.05em}
.hero h1 span{display:block}
.lede{font-size:20px;line-height:1.5;color:#3B4254;max-width:36ch;margin:24px 0 30px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.market{margin-top:34px;display:flex;gap:14px;align-items:flex-start;padding-top:22px;border-top:1px solid var(--line);max-width:600px}
.market .flag{font-size:30px;line-height:1}
.market b{font-size:15.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:#E3F5F3;color:#047A71;margin-left:6px;vertical-align:2px}
.pill.prop{background:#FFF4D6;color:#8A6A10}
.facts{display:flex;flex-wrap:wrap;gap:3px 16px;font-size:13.5px;color:var(--muted);margin-top:5px}
.facts span b{color:var(--ink);font-weight:600;font-size:13.5px}
.mnote{font-size:13px;color:var(--muted);margin-top:6px}
.rings{background:#fff;border-radius:34px;padding:30px;box-shadow:0 40px 90px -60px rgba(27,30,43,.55),0 0 0 1px rgba(27,30,43,.04);display:grid;grid-template-columns:210px 1fr;gap:26px;align-items:center}
.rings svg{width:210px;height:210px;transform:rotate(-90deg)}
.rings circle{fill:none;stroke-width:17;stroke-linecap:round}
.rings .tr{opacity:.13}
.rings .pr{transition:stroke-dashoffset 1.8s cubic-bezier(.2,.7,.2,1)}
.rl{display:flex;flex-direction:column;gap:14px}
.rl div{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:15px;font-weight:600}
.rl i{width:12px;height:12px;border-radius:50%}
.rl b{font-variant-numeric:tabular-nums;font-weight:700}
.rl small{color:var(--muted);font-weight:500}
.lvl{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center}
.lvl .badge{width:48px;height:48px;border-radius:15px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.lvl b{font-size:16px}.lvl small{display:block;color:var(--muted);font-size:13px}
.xpbar{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:7px}.xpbar i{display:block;height:100%;background:var(--red);transition:width 1.2s}
/* today band */
.today{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.today .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.today article{padding:30px 30px 32px;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start}
.today article:first-child{border-left:0;padding-left:0}
.today small{display:block;color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:6px}
.today h3{margin:0 0 6px;font-size:21px;letter-spacing:-.015em;line-height:1.25}
.today p{margin:0 0 16px;color:var(--muted);font-size:15px}
.today .btn{margin-top:auto}
/* sections */
.sec{padding:100px 0}
.sec.white{background:#fff}
.sec.dark{background:var(--navy);color:#E9EBF2}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:44px;flex-wrap:wrap}
.sh h2{margin:0;font-weight:800;font-size:clamp(36px,4.6vw,60px);line-height:1;letter-spacing:-.04em;max-width:15ch}
.sh p{margin:14px 0 0;font-size:18.5px;color:var(--muted);max-width:54ch}
.dark .sh p{color:#B4B9CB}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(27,30,43,.15)}
/* ladder */
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:end;margin-bottom:56px}
.step{position:relative}
.step .bar{height:calc(var(--h) * 1px);background:#E2E4EA;border-radius:14px 14px 4px 4px;margin-bottom:14px}
.step.done .bar{background:var(--navy)}.step.on .bar{background:var(--red)}
.step em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);display:block}
.step b{font-size:18px;letter-spacing:-.01em}
.step small{display:block;color:var(--muted);font-size:13.5px;line-height:1.45;margin-top:4px}
.ramp{font-size:14px;color:var(--muted);margin:-34px 0 44px}
.tracks{border-top:1px solid var(--line)}
.track{display:grid;grid-template-columns:minmax(230px,1fr) 2fr;gap:30px;padding:30px 0;border-bottom:1px solid var(--line)}
.track h3{margin:0;font-size:23px;letter-spacing:-.02em}
.track p{margin:6px 0 12px;color:var(--muted);font-size:15px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.prog .bar{flex:1;max-width:170px;height:6px;border-radius:6px;background:#E2E4EA;overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--teal)}
.opt{font-size:12px;font-weight:700;color:#8A6A10;background:#FFF4D6;border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:3px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lesson{position:relative;display:flex;align-items:center;gap:13px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:15px 16px}
.lesson:hover{border-color:var(--navy)}
.lesson .ck{width:30px;height:30px;border-radius:50%;border:2px solid #D5D8E0;display:grid;place-items:center;flex-shrink:0;color:#fff}
.lesson.done .ck{background:var(--teal);border-color:var(--teal)}
.lesson b{display:block;font-size:15.5px;line-height:1.3}.lesson small{color:var(--muted);font-size:13px}
/* moments */
.film{display:flex;gap:20px;overflow-x:auto;padding:4px 2px 20px;scroll-snap-type:x mandatory;scrollbar-color:#3A3F55 transparent}
.mo{position:relative;flex:0 0 300px;scroll-snap-align:start;text-align:left;border:0;background:none;color:inherit;padding:0;text-decoration:none}
.thumb{height:172px;border-radius:20px;background:var(--navy2);position:relative;overflow:hidden;margin-bottom:14px}
.thumb svg{width:100%;height:100%;display:block}
.thumb .play{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center}
.thumb .dur{position:absolute;left:12px;top:12px;font-size:12px;font-weight:700;background:rgba(0,0,0,.35);color:#fff;padding:3px 9px;border-radius:999px}
.thumb .seen{position:absolute;left:12px;bottom:12px;font-size:12px;font-weight:700;background:var(--teal);color:#fff;padding:3px 9px;border-radius:999px}
.mo b{display:block;font-size:17px;color:#fff;line-height:1.3}.mo span.d{display:block;font-size:14px;color:#B4B9CB;margin-top:3px}
.mo:hover .thumb{outline:2px solid rgba(255,255,255,.5);outline-offset:3px}
/* champion */
.champ{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
.deck{perspective:1600px}
.flip{position:relative;height:400px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:30px;padding:32px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.face.front{background:var(--navy);color:#fff}
.face.back{background:#fff;box-shadow:inset 0 0 0 1px var(--line);transform:rotateY(180deg)}
.face .cnt{font-size:13.5px;font-weight:700;color:#B4B9CB}
.face.back .cnt{color:var(--muted)}
.face h3{font-size:clamp(36px,4vw,54px);line-height:1;letter-spacing:-.04em;margin:auto 0 12px}
.face.back h3{font-size:clamp(24px,2.4vw,31px);line-height:1.2;letter-spacing:-.02em;margin:18px 0 14px}
.face p{margin:0;font-size:16px;line-height:1.55}
.face .ask{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-weight:600}
.face .ask small{display:block;color:var(--muted);font-size:13px;font-weight:700}
.timer{display:flex;align-items:center;gap:12px;margin-top:20px}
.timer svg{width:52px;height:52px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:6}
.dk{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.dk .sp{flex:1}
.pitch{background:#fff;border-radius:30px;padding:28px;box-shadow:inset 0 0 0 1px var(--line)}
.pitch h3{margin:0 0 16px;font-size:24px;letter-spacing:-.02em}
.f{margin-bottom:14px}
.f label{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;font-variant-numeric:tabular-nums}
.f textarea{min-height:90px;resize:vertical;font-size:14px}
.out{background:var(--canvas);border-radius:18px;padding:18px;font-size:16.5px;line-height:1.6;min-height:120px;margin-top:6px}
/* industries */
.ind{border-top:1px solid var(--line)}
.irow{display:grid;grid-template-columns:44px minmax(160px,1fr) 1.5fr 1fr 22px;gap:18px;align-items:center;padding:20px 4px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.irow:hover{background:rgba(255,255,255,.6)}
.irow .ic{font-size:26px}
.irow b{font-size:18px;letter-spacing:-.01em}
.irow span{color:var(--muted);font-size:15px}
.irow .chev{transition:transform .3s}.irow[aria-expanded=true] .chev{transform:rotate(180deg)}
.idet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;padding:6px 4px 30px 66px;border-bottom:1px solid var(--line)}
.idet h4{margin:0 0 6px;font-size:13.5px;color:var(--muted)}
.idet p,.idet li{font-size:15.5px;margin:0}
.idet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.idet .acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
/* segments */
.mx{overflow-x:auto}
.mx table{width:100%;border-collapse:collapse;min-width:860px}
.mx th,.mx td{padding:18px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.mx thead th{font-size:24px;letter-spacing:-.025em;border-bottom:2px solid var(--ink)}
.mx thead th small{display:block;font-size:13.5px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:3px}
.mx tbody th{font-size:13.5px;color:var(--muted);font-weight:700;width:190px}
.mx td{font-size:16px}
/* grow */
.grow{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:start}
.panel{background:#fff;border-radius:30px;padding:30px;box-shadow:inset 0 0 0 1px var(--line)}
.panel h3{margin:0 0 4px;font-size:25px;letter-spacing:-.02em}
.panel>p{margin:0 0 18px;color:var(--muted);font-size:15px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.big{font-weight:800;font-size:clamp(36px,4.2vw,56px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.res div{background:var(--canvas);border-radius:16px;padding:14px}
.res small{display:block;color:var(--muted);font-size:12.5px;font-weight:700}
.res b{font-size:17px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.q{margin-bottom:14px}.q b{display:block;font-size:14.5px;margin-bottom:7px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.opts button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.pres{background:var(--navy);color:#E9EBF2;border-radius:22px;padding:20px;margin-top:8px}
.pres .kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pres small{display:block;color:#B4B9CB;font-size:12.5px;font-weight:700}
.pres b{font-size:22px;color:#fff;letter-spacing:-.02em}
.pres ul{margin:4px 0 14px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:15px}
.pres .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--red);color:#fff;font-weight:800;font-size:12.5px;margin-right:8px}
/* tools */
.dock{display:grid;grid-template-columns:repeat(6,1fr);gap:34px 18px}
.app{position:relative;text-align:center;text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:9px;border:0;background:none;padding:0}
.app .ico{width:78px;height:78px;border-radius:23px;display:grid;place-items:center;color:#fff;box-shadow:0 18px 34px -20px rgba(27,30,43,.65);transition:transform .25s}
.app:hover .ico{transform:translateY(-3px)}
.app .ico svg{width:34px;height:34px}
.app b{font-size:15px;line-height:1.25}.app small{font-size:12.5px;color:var(--muted);max-width:17ch;line-height:1.35}
/* library */
.lib-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:240px;border:1px solid var(--line);border-radius:999px;padding:13px 20px;font-size:16px;background:#fff}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.typechips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.typechips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600}
.typechips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lib{background:#fff;border-radius:26px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.li{position:relative;display:grid;grid-template-columns:76px 1fr auto;gap:18px;align-items:center;padding:17px 22px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.fmt{font-size:12px;font-weight:800;border-radius:10px;padding:9px 0;text-align:center;background:var(--soft);color:var(--muted)}
.fmt.PPTX{background:#FDECEC;color:var(--red-d)}.fmt.HTML{background:#E3F5F3;color:#047A71}.fmt.Drive{background:#FFF4D6;color:#8A6A10}.fmt.Web{background:#ECEEFF;color:#3341A8}
.li b{font-size:16px}.li p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.meta{display:flex;gap:12px;font-size:12.5px;color:var(--muted);margin-top:5px;flex-wrap:wrap}
.count{font-size:14px;color:var(--muted);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* rules */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:44px}
.rules h3{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
.claim{display:grid;grid-template-columns:14px 1fr;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.claim i{width:12px;height:12px;border-radius:4px;margin-top:7px}
.claim b{font-size:16px}.claim p{margin:2px 0 0;color:var(--muted);font-size:15px}
.rule{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);font-size:16px}
.rule svg{color:var(--red);margin-top:3px}
/* footer */
footer{background:var(--navy);color:#B4B9CB;padding:60px 0 50px;font-size:14px}
footer .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
footer img{height:26px;margin-bottom:14px}
footer b{color:#fff;display:block;font-size:16px;margin-bottom:8px}
footer a{display:block;text-decoration:none;color:#D5D9E6;margin:4px 0}
footer p{margin:0;line-height:1.6;max-width:56ch}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(18,21,33,.52);z-index:100;display:flex;justify-content:flex-end}
.ov.center{justify-content:center;align-items:center;padding:20px}
.drawer{background:#fff;width:min(700px,100%);height:100%;overflow:auto;padding:34px 38px 40px;animation:din .35s cubic-bezier(.2,.7,.2,1)}
@keyframes din{from{transform:translateX(30px);opacity:.4}}
.drawer .x{float:right}
.drawer h2{font-size:36px;letter-spacing:-.035em;line-height:1.05;margin:8px 0 6px}
.drawer h3{font-size:19px;margin:26px 0 6px;letter-spacing:-.01em}
.drawer p{margin:0;font-size:16.5px;line-height:1.65;color:#2F3546}
.dmeta{display:flex;gap:12px;color:var(--muted);font-size:14px;font-weight:600}
.take{background:var(--canvas);border-radius:18px;padding:16px 18px;margin-top:22px}
.take li{margin:4px 0}
.quiz{margin-top:8px;display:flex;flex-direction:column;gap:18px}
.quiz fieldset{border:0;padding:0;margin:0}
.quiz legend{font-weight:700;margin-bottom:8px;font-size:16px}
.quiz label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:15.5px;cursor:pointer}
.quiz label.ok{border-color:var(--teal);background:#E3F5F3}.quiz label.no{border-color:#F2A7A2;background:#FDF0EF}
.fb{font-size:14px;font-weight:700;margin-top:4px}
.dfoot{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}

lan. Validasi dengan tim negara."}},{"code":"VN","flag":"🇻🇳","name":{"en":"Vietnam","id":"Vietnam","th":"เวียดนาม","fil":"Vietnam"},"cur":"VND","dec":0,"status":"proposed","lang":"en","wave":{"en":"Proposed wave 3, bank and insurer partnerships via 2C2P","id":"Usulan gelombang 3, kemitraan bank dan asuransi via 2C2P"},"rails":"VietQR / NAPAS, MoMo, ZaloPay, cards","recurring":{"en":"Cards and tokenised wallets where available","id":"Kartu dan wallet bertoken bila tersedia"},"tax":"VAT 10%","channel":{"en":"Zalo and email","id":"Zalo dan email"},"focus":{"en":"Insurance, education, utilities","id":"Asuransi, pendidikan, utilitas"},"notes":{"en":"Selling model is a proposal. Validate with the country team.","id":"Model penjualan masih usulan. Validasi dengan tim negara."}}],"levels":[{"n":1,"name":{"en":"Explain","id":"Menjelaskan","th":"อธิบาย","fil":"Ipaliwanag"},"xp":0,"desc":{"en":"Explain FlexiBill and the eight ways to collect","id":"Menjelaskan FlexiBill dan delapan cara menagih"}},{"n":2,"name":{"en":"Demo","id":"Mendemokan","th":"สาธิต","fil":"Ipakita"},"xp":120,"desc":{"en":"Run the presentation end to end for any business","id":"Menjalankan presentasi dari awal sampai akhir untuk bisnis apa pun"}},{"n":3,"name":{"en":"Configure","id":"Mengonfigurasi","th":"ตั้งค่า","fil":"I-configure"},"xp":300,"desc":{"en":"Set up a merchant’s catalogue live","id":"Menyiapkan katalog merchant secara live"}},{"n":4,"name":{"en":"Architect","id":"Merancang","th":"ออกแบบ","fil":"Magdisenyo"},"xp":520,"desc":{"en":"Design hybrid orchestration with the merchant’s IT","id":"Merancang orkestrasi hybrid bersama tim IT merchant"}},{"n":5,"name":{"en":"Lead","id":"Memimpin","th":"นำทีม","fil":"Mamuno"},"xp":760,"desc":{"en":"Coach others and shape the roadmap","id":"Melatih rekan dan ikut membentuk roadmap"}}],"tracks":[{"id":"found","core":true,"title":{"en":"FlexiBill foundations","id":"Dasar FlexiBill"},"desc":{"en":"What it is, the building blocks and the subscription lifecycle.","id":"Apa itu FlexiBill, komponen dasarnya, dan siklus subscription."},"lessons":["a1","a2","a3","a4"]},{"id":"collect","core":true,"title":{"en":"Collect like a pro","id":"Menagih seperti pro"},"desc":{"en":"Eight ways to collect, auto-debit, the Billing Portal and orchestration.","id":"Delapan cara menagih, auto-debit, Billing Portal, dan orkestrasi."},"lessons":["b1","b2","b3","b4"]},{"id":"win","core":true,"title":{"en":"Sell and win","id":"Menjual dan menang"},"desc":{"en":"Profile the merchant, choose the path, run the demo, handle objections.","id":"Profil merchant, pilih jalur, jalankan demo, tangani keberatan."},"lessons":["c1","c2","c3","c4"]},{"id":"industry","core":false,"title":{"en":"Industry plays","id":"Strategi industri"},"desc":{"en":"Insurance, education, lending and travel in depth.","id":"Asuransi, pendidikan, pinjaman, dan travel secara mendalam."},"lessons":["d1","d2","d3","d4"]}],"lessons":{"a1":{"title":{"en":"What FlexiBill is","id":"Apa itu FlexiBill"},"mins":6,"level":1,"sections":[{"h":{"en":"The promise","id":"Janjinya"},"p":{"en":"FlexiBill connects the merchant’s billing rules to payment execution: define what is owed, create the bill, deliver it, collect it, recover it and reconcile it, in one place.","id":"FlexiBill menghubungkan aturan tagihan merchant dengan eksekusi pembayaran: tentukan kewajiban, buat tagihan, kirim, tagih, pulihkan, dan rekonsiliasi, di satu tempat."}},{"h":{"en":"Two products, one suite","id":"Dua produk, satu rangkaian"},"p":{"en":"Billing Automation decides: plans, prices, coupons, tax, invoices, reminders, grace and statuses. Billing Recurring collects: tokens, schedules, retries and callbacks through Account Billing.","id":"Billing Automation menentukan: plan, harga, kupon, pajak, invoice, pengingat, grace, dan status. Billing Recurring menagih: token, jadwal, retry, dan callback melalui Account Billing."}},{"h":{"en":"Where it plays","id":"Di liga mana","th":"ลีกที่แข่งขัน","fil":"Saan ito naglalaro"},"p":{"en":"Its league is subscription billing. Benchmark it against global subscription-billing platforms on plans, lifecycle, recovery and reporting, and describe competitors by type, never by name.","id":"Liganya adalah subscription billing. Bandingkan dengan platform subscription billing global pada plan, siklus, pemulihan, dan laporan, dan sebut kompetitor berdasarkan tipenya, bukan namanya."}},{"h":{"en":"The pillars","id":"Pilarnya"},"p":{"en":"Subscription and Billing, Member Center, Account Billing, Billing PWA and apps, Pricing Table, Dashboard, PayChat and the API for both automation and recurring.","id":"Subscription and Billing, Member Center, Account Billing, Billing PWA dan aplikasi, Pricing Table, Dashboard, PayChat, dan API untuk automation maupun recurring."}}],"takeaways":[{"en":"Lead with the outcome: billing that runs itself","id":"Mulai dari hasil: penagihan yang berjalan sendiri"},{"en":"Automation decides, Recurring collects","id":"Automation menentukan, Recurring menagih"}],"quiz":[{"q":{"en":"Which product executes the tokenised charge on the date?","id":"Produk mana yang mengeksekusi penagihan token di tanggalnya?"},"o":[{"en":"Billing Automation","id":"Billing Automation"},{"en":"Billing Recurring through Account Billing","id":"Billing Recurring melalui Account Billing"},{"en":"The Pricing Table","id":"Pricing Table"}],"a":1},{"q":{"en":"How should you describe competitors?","id":"Bagaimana menyebut kompetitor?"},"o":[{"en":"By name, to show we know them","id":"Dengan nama, agar terlihat paham"},{"en":"By type, for example a global subscription-billing platform","id":"Berdasarkan tipe, misalnya platform subscription billing global"},{"en":"Not at all","id":"Tidak perlu sama sekali"}],"a":1}],"links":[{"t":{"en":"Open the presentation","id":"Buka presentasi"},"url":"FlexiBill_Demo_Engine_v3.html#present"}]},"a2":{"title":{"en":"The building blocks","id":"Komponen dasar"},"mins":8,"level":1,"sections":[{"h":{"en":"Collection","id":"Collection"},"p":{"en":"A product line with its payment rules. The invoice term sets the due date: due upon receipt, a number of days or the end of the month. The grace period, up to 90 days, keeps the service on with no penalty.","id":"Lini produk beserta aturan bayarnya. Invoice term menentukan jatuh tempo: saat diterima, sejumlah hari, atau akhir bulan. Grace period, hingga 90 hari, menjaga layanan tetap jalan tanpa denda."}},{"h":{"en":"Plan and add-on","id":"Plan dan add-on"},"p":{"en":"A plan is recurring or a one-off charge, with a pricing model, interval and duration: unlimited or ending after a number of bills. Add-ons are extras such as a registration fee on the first invoice.","id":"Plan bersifat berulang atau sekali bayar, dengan model harga, interval, dan durasi: tanpa batas atau berakhir setelah sejumlah tagihan. Add-on adalah tambahan seperti biaya registrasi di invoice pertama."}},{"h":{"en":"Coupon and tax","id":"Kupon dan pajak"},"p":{"en":"Coupons are flat or percentage with a stock, a redemption type (one time, unlimited, limited), a validity window, eligible members and a scope: the whole invoice or specified items. Tax is created once and applied on every invoice.","id":"Kupon berupa flat atau persentase dengan stok, tipe penukaran (sekali, tanpa batas, terbatas), periode berlaku, member yang berhak, dan cakupan: seluruh invoice atau item tertentu. Pajak dibuat sekali dan diterapkan di setiap invoice."}},{"h":{"en":"Pricing Table, subscription and bill","id":"Pricing Table, subscription, dan tagihan"},"p":{"en":"The Pricing Table sells up to ten plans by link, QR or embed. A purchase creates a subscription, and every cycle creates a bill with an invoice, reminders and a receipt.","id":"Pricing Table menjual hingga sepuluh plan via link, QR, atau embed. Pembelian membuat subscription, dan setiap siklus membuat tagihan lengkap dengan invoice, pengingat, dan bukti bayar."}}],"takeaways":[{"en":"Collection rules decide the due date and grace","id":"Aturan Collection menentukan jatuh tempo dan grace"},{"en":"Coupons close themselves when the stock or date runs out","id":"Kupon tutup sendiri saat stok atau tanggal habis"}],"quiz":[{"q":{"en":"What happens when the grace period ends unpaid?","id":"Apa yang terjadi saat grace berakhir tanpa pembayaran?"},"o":[{"en":"The subscription expires","id":"Subscription menjadi expired"},{"en":"A penalty is added","id":"Denda ditambahkan"},{"en":"Nothing changes","id":"Tidak ada perubahan"}],"a":0},{"q":{"en":"Where does a registration fee usually go?","id":"Biaya registrasi biasanya ditempatkan di mana?"},"o":[{"en":"As an add-on on the first invoice","id":"Sebagai add-on di invoice pertama"},{"en":"As a tax","id":"Sebagai pajak"},{"en":"As a coupon","id":"Sebagai kupon"}],"a":0}],"links":[{"t":{"en":"Show it in the presentation","id":"Tunjukkan di presentasi"},"url":"FlexiBill_Demo_Engine_v3.html#present=coll"}]},"a3":{"title":{"en":"Six pricing models","id":"Enam model harga"},"mins":6,"level":2,"sections":[{"h":{"en":"The models","id":"Modelnya"},"p":{"en":"Flat for one price; Per Unit for seats, kilos or square metres; Tiered, Volume and Stairstep for bands; Open Amount through the API when the amount comes from the merchant’s system.","id":"Flat untuk satu harga; Per Unit untuk seat, kilo, atau meter persegi; Tiered, Volume, dan Stairstep untuk band harga; Open Amount melalui API saat nominal berasal dari sistem merchant."}},{"h":{"en":"Pick by business","id":"Pilih sesuai bisnis"},"p":{"en":"Gyms and schools start with Flat; property service charges use Per Unit per square metre; utilities and water use Tiered; platforms charge partners with Stairstep bands.","id":"Gym dan sekolah mulai dengan Flat; IPL properti memakai Per Unit per meter persegi; utilitas dan air memakai Tiered; platform menagih mitra dengan band Stairstep."}}],"takeaways":[{"en":"The price preview shows what the customer pays before saving","id":"Preview harga menunjukkan yang dibayar pelanggan sebelum disimpan"}],"quiz":[{"q":{"en":"A property charges by square metre. Which model?","id":"Properti menagih per meter persegi. Model apa?"},"o":[{"en":"Flat","id":"Flat"},{"en":"Per Unit","id":"Per Unit"},{"en":"Stairstep","id":"Stairstep"}],"a":1}],"links":[{"t":{"en":"See plan creation","id":"Lihat pembuatan plan"},"url":"FlexiBill_Demo_Engine_v3.html#present=plan"}]},"a4":{"title":{"en":"The subscription lifecycle","id":"Siklus subscription"},"mins":7,"level":2,"sections":[{"h":{"en":"Statuses","id":"Status"},"p":{"en":"Created, Not started, Pending, Active, Expired and Cancelled. A subscription can start up to a year ahead and end never, on a date or after a number of bills.","id":"Created, Not started, Pending, Active, Expired, dan Cancelled. Subscription bisa mulai hingga setahun ke depan dan berakhir tidak pernah, di tanggal tertentu, atau setelah sejumlah tagihan."}},{"h":{"en":"Reminders and events","id":"Pengingat dan event"},"p":{"en":"The Renewal Reminder fires three days before billing; the Payment Due Reminder follows an issued bill. Webhooks report Activated, Renewed, Expired, Canceled and Updated so access can switch on and off by itself.","id":"Renewal Reminder terkirim tiga hari sebelum penagihan; Payment Due Reminder mengikuti tagihan yang terbit. Webhook melaporkan Activated, Renewed, Expired, Canceled, dan Updated sehingga akses aktif dan nonaktif sendiri."}},{"h":{"en":"H-1 today","id":"H-1 saat ini"},"p":{"en":"The day-before nudge is sent by the merchant’s system today; configurable reminders are part of Stage 1 in December 2026.","id":"Pengingat sehari sebelumnya saat ini dikirim oleh sistem merchant; pengingat yang dapat diatur masuk Stage 1 pada Desember 2026."}}],"takeaways":[{"en":"Paid at any point before grace ends: renewed","id":"Dibayar kapan pun sebelum grace berakhir: renewed"}],"quiz":[{"q":{"en":"When does the Renewal Reminder fire?","id":"Kapan Renewal Reminder terkirim?"},"o":[{"en":"On the due date","id":"Di tanggal jatuh tempo"},{"en":"Three days before billing","id":"Tiga hari sebelum penagihan"},{"en":"After grace","id":"Setelah grace"}],"a":1}],"links":[{"t":{"en":"Play the reminder timeline","id":"Putar timeline pengingat"},"url":"FlexiBill_Demo_Engine_v3.html#present=reminders"}]},"b1":{"title":{"en":"Eight ways to collect","id":"Delapan cara menagih"},"mins":8,"level":1,"sections":[{"h":{"en":"Live today","id":"Live hari ini"},"p":{"en":"1 Subscribe and pay by Pricing Table link or QR, with auto-debit enrolment. 2 Bill only through Generate Bill or Create Bill. 3 Bulk billing by file, up to 1,000 rows. 6 The Billing Portal for customer-initiated payment (Indonesia). 7 Auto-debit by Account Billing. 8 Hybrid: a FlexiBill bill collected by Account Billing.","id":"1 Langganan dan bayar via link atau QR Pricing Table, dengan enrolment auto-debit. 2 Tagihan saja lewat Generate Bill atau Create Bill. 3 Tagihan massal via file, hingga 1.000 baris. 6 Billing Portal untuk pembayaran inisiatif pelanggan (Indonesia). 7 Auto-debit via Account Billing. 8 Hybrid: tagihan FlexiBill yang ditagih Account Billing."}},{"h":{"en":"Partly live or on request","id":"Sebagian live atau atas permintaan"},"p":{"en":"4 Paying inside the merchant’s own front end: embed today, API checkout on the roadmap. 5 Pay by invoice in the merchant’s portal through Inquiry and Payment Bill APIs, on request.","id":"4 Bayar di front end merchant: embed hari ini, checkout API di roadmap. 5 Bayar per invoice di portal merchant melalui API Inquiry dan Payment Bill, atas permintaan."}},{"h":{"en":"Today’s limits","id":"Batasan saat ini"},"p":{"en":"Bulk bills are paid through the emailed payment link. In Malaysia, recurring bills from Generate Bill are emailed and paid by link.","id":"Tagihan massal dibayar lewat payment link di email. Di Malaysia, tagihan recurring dari Generate Bill dikirim via email dan dibayar lewat link."}}],"takeaways":[{"en":"The way a merchant gets paid decides which features matter","id":"Cara merchant dibayar menentukan fitur yang penting"}],"quiz":[{"q":{"en":"A school sends 800 tuition bills each month from a spreadsheet. Best first way?","id":"Sekolah mengirim 800 tagihan SPP tiap bulan dari spreadsheet. Cara pertama terbaik?"},"o":[{"en":"Bulk billing by file","id":"Tagihan massal via file"},{"en":"API H2H","id":"API H2H"},{"en":"Embed in their app","id":"Embed di aplikasi mereka"}],"a":0}],"links":[{"t":{"en":"Open the eight ways in the demo","id":"Buka delapan cara di demo"},"url":"FlexiBill_Demo_Engine_v3.html#demo=ways"}]},"b2":{"title":{"en":"Auto-debit and Account Billing","id":"Auto-debit dan Account Billing"},"mins":10,"level":3,"sections":[{"h":{"en":"Register once","id":"Daftar sekali"},"p":{"en":"Register Bill V2 returns a checkout link. The customer pays once with 3D Secure; DOKU keeps the token and the schedule, and the merchant keeps only the billing number. useOrderAmount true charges the first cycle immediately.","id":"Register Bill V2 mengembalikan link checkout. Pelanggan membayar sekali dengan 3D Secure; DOKU menyimpan token dan jadwal, merchant cukup menyimpan nomor tagihan. useOrderAmount true langsung menagih siklus pertama."}},{"h":{"en":"Schedule and amount","id":"Jadwal dan nominal"},"p":{"en":"executeType DAY, DATE or FULLDATE with retry dates. flatStatus false fetches the amount from the merchant’s URL before each charge. billingType BILLING_PAYMENT takes the amount from the open FlexiBill bill. Single Monthly Success prevents a second charge in the month.","id":"executeType DAY, DATE, atau FULLDATE dengan tanggal retry. flatStatus false mengambil nominal dari URL merchant sebelum tiap penagihan. billingType BILLING_PAYMENT mengambil nominal dari tagihan FlexiBill yang terbuka. Single Monthly Success mencegah penagihan kedua dalam sebulan."}},{"h":{"en":"By market","id":"Per pasar"},"p":{"en":"Cards need SALE plus RECURRING or MOTO. Indonesia adds direct debit (BRI, CIMB Niaga, Allo Bank) and OVO Plus; Malaysia runs on cards only.","id"   const cards = champCards(); const pf = S.pitch || {}; const m = C.industries[+pf.m] || C.industries[0], p = C.industries[+pf.p] || C.industries[0], f = cards[+pf.f] || cards[0]; if (!m || !p || !f) return;
  const own = UI[S.lang] && UI[S.lang].pitchTpl; const TT = o => own ? T(o) : (o ? (o.en || '') : ''); const low = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : '';
  S.pitchOut = u('pitchTpl').replace('{m}', TT(m.name)).replace('{p}', TT(p.pain)).replace('{l}', low(TT(f.line))).replace('{r}', TT(f.proof)).replace('{a}', TT(f.ask));
  $('#pout').textContent = S.pitchOut; const key = [pf.m, pf.p, pf.f].join('-');
  if (!P.pitchKeys[key]) { P.pitchKeys[key] = 1; P.pitches++; addXP(10); refreshProgress(); } saveP();
}
// ---------- video moments
function videoEmbed(url) { let m; url = String(url || ''); if ((m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/))) return `<iframe src="https://www.youtube.com/embed/${m[1]}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="Video"></iframe>`; if ((m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return `<iframe src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay" allowfullscreen title="Video"></iframe>`; if (/\.(mp4|webm|mov)(\?|$)/i.test(url)) return `<video src="${esc(url)}" controls autoplay></video>`; return null; }
function openVideo(i) { const m = C.moments[i]; if (!m) return; const e = videoEmbed(m.url); track('mo:' + m.id); if (!e) { window.open(demoLink(m.url), '_blank', 'noopener'); return; } $('#ov').innerHTML = `<div class="ov center" data-act="ovclose"><div class="mdl video" role="dialog" aria-modal="true" aria-label="${esc(T(m.title))}">${e}</div></div>`; }
// ---------- sound
function soundOn() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } if (AC.state === 'suspended') AC.resume();
  const m = AC.createGain(); m.gain.setValueAtTime(0, AC.currentTime); m.gain.linearRampToValueAtTime(0.05, AC.currentTime + 2); const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700; lp.connect(m); m.connect(AC.destination);
  const CH = [[220, 277.18, 329.63, 415.3], [196, 246.94, 293.66, 369.99], [174.61, 220, 261.63, 329.63], [196, 246.94, 311.13, 392]]; let i = 0;
  const play = () => { const t = AC.currentTime + 0.05, ch = CH[i % 4]; ch.forEach((f, k) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = k ? 'sine' : 'triangle'; o.frequency.value = k ? f : f / 2; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.12, t + 1.6); g.gain.linearRampToValueAtTime(0.0001, t + 7.6); o.connect(g); g.connect(lp); o.start(t); o.stop(t + 7.8); }); [0, 2, 1, 3, 2, 3, 1, 0].forEach((k, j) => { const o = AC.createOscillator(), g = AC.createGain(), tt = t + 0.5 + j * 0.85; o.type = 'sine'; o.frequency.value = ch[k] * 2; g.gain.setValueAtTime(0.0001, tt); g.gain.linearRampToValueAtTime(0.035, tt + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.8); o.connect(g); g.connect(lp); o.start(tt); o.stop(tt + 0.85); }); i++; };
  play(); MUS = { m, iv: setInterval(play, 7400) };
}
function soundOff() { if (!MUS) return; clearInterval(MUS.iv); const m = MUS.m; try { m.gain.cancelScheduledValues(AC.currentTime); m.gain.setValueAtTime(m.gain.value, AC.currentTime); m.gain.linearRampToValueAtTime(0, AC.currentTime + 0.8); } catch (e) {} setTimeout(() => m.disconnect(), 1000); MUS = null; }
// ---------- Content Studio
const BLANK = {
  moments: { id: '', title: { en: '', id: '' }, desc: { en: '', id: '' }, kind: 'link', url: '', mins: 3, art: 'grid', countries: ['ID', 'MY'] },
  tools: { id: '', name: { en: '', id: '' }, desc: { en: '', id: '' }, icon: 'doc', color: '#1B1E2B', url: '' },
  library: { id: '', title: { en: '', id: '' }, type: 'Doc', format: 'Web', audience: 'Sales', countries: ['ID'], langs: ['EN'], url: '', updated: new Date().toISOString().slice(0, 10), desc: { en: '', id: '' } },
  champion: { id: '', feature: { en: '', id: '' }, line: { en: '', id: '' }, proof: { en: '', id: '' }, ask: { en: '', id: '' } },
  industries: { id: '', icon: '⭐', name: { en: '', id: '' }, pain: { en: '', id: '' }, recipe: { en: '', id: '' }, ways: '1', metric: { en: '', id: '' }, q: [], lob: '' },
};
function persist() { C.meta = Object.assign({}, C.meta, { updated: new Date().toISOString().slice(0, 10) }); LS.set('content', C); }
function toggleStudio() { const on = document.body.classList.toggle('studio'); renderNav(); toast(on ? u('studioOn') : u('studioOff')); if (on) openStudio(); }
function openStudio() {
  if (!document.body.classList.contains('studio')) { document.body.classList.add('studio'); renderNav(); }
  const cols = [['lessons', 'Lessons'], ['tracks', 'Learning paths'], ['levels', 'Levels'], ['countries', 'Countries'], ['segments', 'Segments'], ['guardrails', 'Guardrails'], ['meta', 'Hub settings']];
  $('#ov').innerHTML = `<div class="ov" data-act="ovclose"><aside class="drawer" role="dialog" aria-modal="true" aria-label="${u('studio')}"><button class="ib x" data-act="close" aria-label="${u('close')}">${icon('x')}</button><h2>${u('studio')}</h2><p>${u('studioP')}</p>
   <div class="dfoot"><button class="btn red" data-act="exportHtml">${icon('download')}${u('exportHtml')}</button><button class="btn ghost" data-act="exportJson">${icon('download')}${u('exportJson')}</button><label class="btn ghost" style="cursor:pointer">${icon('upload')}${u('importJson')}<input type="file" accept=".json,application/json" id="impfile" hidden></label><button class="btn ghost" data-act="reset">${icon('reset')}${u('reset')}</button></div>
   <h3>${u('collections')}</h3><div class="dfoot" style="margin-top:10px">${cols.map(([k, l]) => `<button class="btn ghost sm" data-act="json" data-c="${k}">${l}</button>`).join('')}</div>
   <h3>${u('howTo')}</h3><ol style="padding-left:20px;line-height:1.7">${u('pub').map(x => `<li>${esc(x)}</li>`).join('')}</ol></aside></div>`;
}
function fieldHtml(k, v) {
  if (v && typeof v === 'object' && !Array.isArray(v) && ('en' in v || 'id' in v)) return `<div class="full"><b style="font-size:14px">${esc(k)}</b><div class="edgrid">${['en', 'id', 'th', 'fil'].map(l => `<div class="f"><label>${l.toUpperCase()}</label><textarea rows="2" data-ek="${esc(k)}" data-el="${l}">${esc(v[l] || '')}</textarea></div>`).join('')}</div></div>`;
  if (Array.isArray(v) && v.every(x => typeof x === 'string')) return `<div class="f"><label>${esc(k)} (a, b, c)</label><input data-ek="${esc(k)}" data-et="arr" value="${esc(v.join(', '))}"></div>`;
  if (typeof v === 'number') return `<div class="f"><label>${esc(k)}</label><input type="number" data-ek="${esc(k)}" data-et="num" value="${v}"></div>`;
  if (typeof v === 'boolean') return `<div class="f"><label>${esc(k)}</label><select data-ek="${esc(k)}" data-et="bool"><option ${v ? 'selected' : ''}>true</option><option ${v ? '' : 'selected'}>false</option></select></div>`;
  if (typeof v === 'string') return `<div class="f ${v.length > 60 ? 'full' : ''}"><label>${esc(k)}</label><input data-ek="${esc(k)}" data-et="str" value="${esc(v)}"></div>`;
  return `<div class="f full"><label>${esc(k)} (JSON)</label><textarea rows="5" data-ek="${esc(k)}" data-et="json" spellcheck="false">${esc(JSON.stringify(v, null, 1))}</textarea></div>`;
}
function openEdit(c, i) {
  ED = { c, i: +i }; const item = (C[c] || [])[ED.i]; if (!item) return;
  $('#ov').innerHTML = `<div class="ov center" data-act="ovclose"><div class="mdl" role="dialog" aria-modal="true" aria-label="${u('edit')}"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><h3 style="margin:0;font-size:22px;flex:1">${u('edit')}: ${esc(T(item.title || item.name || item.feature) || item.id)}</h3><button class="ib" data-act="close" aria-label="${u('close')}">${icon('x')}</button></div><form id="edform" class="edgrid" onsubmit="return false">${Object.entries(item).map(([k, v]) => fieldHtml(k, v)).join('')}</form>
   <div class="dfoot"><button class="btn red" data-act="edsave">${u('save')}</button><button class="btn ghost" data-act="close">${u('cancel')}</button><span style="flex:1"></span><button class="btn ghost sm" data-act="edmove" data-v="-1">${icon('up')}${u('up')}</button><button class="btn ghost sm" data-act="edmove" data-v="1">${icon('down')}${u('down')}</button><button class="btn ghost sm" data-act="eddel" style="color:#B51D15">${u('del')}</button></div></div></div>`;
}
function saveEdit() {
  const item = JSON.parse(JSON.stringify(C[ED.c][ED.i])); let bad = false;
  $$('#edform [data-ek]').forEach(el => { const k = el.dataset.ek, t = el.dataset.et, l = el.dataset.el;
    if (l) { if (!item[k] || typeof item[k] !== 'object') item[k] = {}; const v = el.value.trim(); if (v) item[k][l] = v; else if (l === 'en') item[k].en = ''; else delete item[k][l]; }
    else if (t === 'arr') item[k] = el.value.split(',').map(s => s.trim()).filter(Boolean);
    else if (t === 'num') item[k] = Number(el.value) || 0;
    else if (t === 'bool') item[k] = el.value === 'true';
    else if (t === 'json') { try { item[k] = JSON.parse(el.value); } catch (e) { bad = true; } }
    else item[k] = el.value; });
  if (bad) { toast(u('badJson')); return; } C[ED.c][ED.i] = item; persist(); closeOv(); renderAll(); toast(u('saved'));
}
function moveItem(d) { const a = C[ED.c]; const j = ED.i + d; if (!a || j < 0 || j >= a.length) return; [a[ED.i], a[j]] = [a[j], a[ED.i]]; ED.i = j; persist(); renderAll(); toast(u('saved')); }
function delItem() { if (!confirm(u('confirmDel'))) return; C[ED.c].splice(ED.i, 1); persist(); closeOv(); renderAll(); toast(u('removed')); }
function addItem(c) { if (!BLANK[c]) return; const b = JSON.parse(JSON.stringify(BLANK[c])); b.id = c.slice(0, 2) + Date.now().toString(36); C[c].push(b); persist(); renderAll(); openEdit(c, C[c].length - 1); }
function openJson(k) { ED = { json: k }; $('#ov').innerHTML = `<div class="ov center" data-act="ovclose"><div class="mdl" role="dialog" aria-modal="true" aria-label="${esc(k)}"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><h3 style="margin:0;font-size:22px;flex:1">${esc(k)}</h3><button class="ib" data-act="close" aria-label="${u('close')}">${icon('x')}</button></div><div class="f"><textarea id="jsontext" rows="22" spellcheck="false" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px">${esc(JSON.stringify(C[k], null, 2))}</textarea></div><div class="dfoot"><button class="btn red" data-act="jsonsave">${u('save')}</button><button class="btn ghost" data-act="close">${u('cancel')}</button></div></div></div>`; }
function saveJson() { try { C[ED.json] = JSON.parse($('#jsontext').value); persist(); closeOv(); renderAll(); toast(u('saved')); } catch (e) { toast(u('badJson')); } }
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); }
function exportHtml() { const json = JSON.stringify(C).replace(/</g, '\\u003c'); const html = TEMPLATE.replace(/(<script type="application\/json" id="hub-content">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b); download('IGNITE_Arena.html', html, 'text/html'); }
function exportJson() { download('ignite-arena-content.json', JSON.stringify(C, null, 2), 'application/json'); }
function importJson(file) { const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o.lessons || !o.tracks || !o.library) throw new Error('shape'); C = o; persist(); closeOv(); renderAll(); toast(u('imported')); } catch (e) { toast(u('badJson')); } }; r.readAsText(file); }
function resetContent() { if (!confirm(u('confirmReset'))) return; LS.del('content'); C = JSON.parse(JSON.stringify(FILE)); closeOv(); renderAll(); toast(u('resetDone')); }
// ---------- navigation highlight
function observeNav() { if (IO) IO.disconnect(); if (!('IntersectionObserver' in window)) return; IO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) $$('#links a').forEach(a => a.classList.toggle('on', a.dataset.sec === e.target.id)); }), { rootMargin: '-45% 0px -50% 0px' }); ['learn', 'moments', 'champion', 'industries', 'segments', 'grow', 'tools', 'library'].forEach(id => { const el = document.getElementById(id); if (el) IO.observe(el); }); }
// ---------- events
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); const tr = e.target.closest('[data-track]'); const a = el ? el.dataset.act : '';
  if (a === 'ovclose' && e.target !== el) { /* click inside a panel */ }
  else if (el) {
    if (a === 'edit' || a === 'add' || a === 'studioPanel') e.preventDefault();
    switch (a) {
      case 'ovclose': case 'close': closeOv(); break;
      case 'continue': { const id = nextLesson(); if (id) openLesson(id); else document.getElementById('learn').scrollIntoView({ behavior: 'smooth' }); break; }
      case 'lesson': openLesson(el.dataset.id); break;
      case 'quiz': checkQuiz(); break;
      case 'complete': markDone(el.dataset.id); break;
      case 'core': S.core = el.dataset.v === '1'; saveS(); renderSec('learn'); break;
      case 'drill': S.card = +el.dataset.i; S.flip = false; stopTimer(); saveS(); renderSec('champion'); document.getElementById('champion').scrollIntoView({ behavior: 'smooth' }); break;
      case 'flip': S.flip = !S.flip; $('#flip').classList.toggle('on', S.flip); el.textContent = S.flip ? u('back') : u('flip'); break;
      case 'timer': startTimer(); break;
      case 'again': S.flip = false; stopTimer(); renderSec('champion'); break;
      case 'nailed': { stopTimer(); P.drills++; addXP(10); saveP(); S.card = (S.card + 1) % Math.max(1, champCards().length); S.flip = false; saveS(); renderSec('champion'); refreshProgress(); break; }
      case 'pitch': buildPitch(); break;
      case 'copy': if (S.pitchOut) { try { navigator.clipboard.writeText(S.pitchOut); } catch (er) {} toast(u('copied')); } break;
      case 'ind': S.openInd = S.openInd === el.dataset.id ? null : el.dataset.id; renderSec('industries'); break;
      case 'pf': S.pf = Object.assign({}, S.pf, { [el.dataset.q]: el.dataset.v }); saveS(); renderSec('grow'); break;
      case 'ltype': S.libType = el.dataset.v; saveS(); renderSec('library'); break;
      case 'menu': $('#links').classList.toggle('open'); break;
      case 'sound': if (MUS) soundOff(); else soundOn(); renderNav(); break;
      case 'studio': toggleStudio(); break;
      case 'studioPanel': openStudio(); break;
      case 'edit': openEdit(el.dataset.c, el.dataset.i); break;
      case 'add': addItem(el.dataset.c); break;
      case 'edsave': saveEdit(); break;
      case 'edmove': moveItem(+el.dataset.v); break;
      case 'eddel': delItem(); break;
      case 'json': openJson(el.dataset.c); break;
      case 'jsonsave': saveJson(); break;
      case 'exportHtml': exportHtml(); break;
      case 'exportJson': exportJson(); break;
      case 'reset': resetContent(); break;
      case 'video': openVideo(+el.dataset.i); break;
    }
  }
  if (tr && !(el && (a === 'edit' || a === 'add'))) track(tr.dataset.track);
  if (e.target.closest('#links a')) { const lk = $('#links'); if (lk) lk.classList.remove('open'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.calc) { calcState()[t.dataset.calc] = Math.max(0, Number(t.value) || 0); saveS(); $('#cout').innerHTML = calcHtml(); return; }
  if (t.dataset.lib === 'q') { S.q = t.value; const items = libItems(); $('#liblist').innerHTML = libList(items); $('#libcount').textContent = items.length + ' ' + u('results'); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pref) { S[t.dataset.pref] = t.value; if (t.dataset.pref === 'country') S.card = 0; saveS(); stopTimer(); renderAll(); return; }
  if (t.dataset.lib === 'aud') { S.libAud = t.value; saveS(); renderSec('library'); return; }
  if (t.dataset.lib === 'mine') { S.mine = t.checked; saveS(); renderSec('library'); return; }
  if (t.dataset.pitch) { S.pitch = Object.assign({}, S.pitch, { [t.dataset.pitch]: t.value }); saveS(); return; }
  if (t.id === 'impfile' && t.files && t.files[0]) importJson(t.files[0]);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#ov').innerHTML) closeOv(); });

renderAll();
