                   show: ['Lihat keajaibannya!', 'Ini dia!'], tada: ['Tada! Rencana Anda siap!', 'Mantap, sudah siap!'], level: ['Naik level!', 'Hore, naik level!'], copy: ['Tersalin!']}};
function speakLine(kind, lang) {

    if (!v && want === 'id') { v = vs.find(x => (x.lang || '').toLowerCase().startsWith('en')); useLang = 'en'; }
    const lines = VOICE[useLang === 'id' ? 'bi' : 'en'][kind]; if (!lines) return;

    if (v) u.voice = v; u.lang = useLang === 'id' ? 'id-ID' : 'en-US'; u.pitch = 1.35; u.rate = 1.08; u.volume = 0.9;

const SMAP = {reveal: 'pop', cta: 'cta', copy: 'copy', tap: 'tap'};

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

function openModal(i) {

document.addEventListener('click', e => {
