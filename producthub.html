<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlexiBill Hub · Indonesia</title>
<style>
:root{--bg:#F6F8FC;--surface:#FFFFFF;--surface2:#EEF2FA;--ink:#0A1B3D;--muted:#56627F;--line:#DDE3EF;--red:#E4002B;--red-soft:#FFE9ED;--teal:#0E8177;--teal-soft:#E1F4EF;--blue:#1B6EF3;--sun:#FFC933;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1226;--surface:#131C36;--surface2:#1A2546;--ink:#EEF2FA;--muted:#A9B4CC;--line:#26324F;--red-soft:#3A1320;--teal-soft:#0F2D2A}}
:root[data-theme="dark"]{--bg:#0B1226;--surface:#131C36;--surface2:#1A2546;--ink:#EEF2FA;--muted:#A9B4CC;--line:#26324F;--red-soft:#3A1320;--teal-soft:#0F2D2A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:Cambria,Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top img{width:44px;height:44px;border-radius:10px}
.top .t b{display:block;font-size:20px}.top .t small{color:var(--muted)}.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;background:var(--surface2);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 18px;font-weight:800;font-size:15px;background:var(--red);color:#fff;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin:26px 0 18px}
.avatar{width:76px;height:76px;border-radius:24px;background:var(--sun);display:grid;place-items:center;font-size:42px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:6px 22px 22px 22px;padding:14px 18px}
.bubble b{font-size:22px;display:block}
.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.paths{grid-template-columns:1fr}}
.path{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.path .pe{font-size:34px}.path h2{font-size:24px}.path .who{color:var(--muted);font-size:14px}
.lv{display:flex;flex-wrap:wrap;gap:6px}.lv span{font-size:12px;font-weight:700;background:var(--surface2);border-radius:999px;padding:4px 9px}
.meta{display:flex;gap:8px;flex-wrap:wrap}.meta .chip.r{background:var(--red-soft);color:var(--red)}
details{border-top:1px dashed var(--line);padding-top:8px}summary{cursor:pointer;font-weight:800;color:var(--blue)}
ol.ch{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:6px}ol.ch li{display:flex;gap:8px;align-items:center;font-size:14.5px}
ol.ch li small{margin-left:auto;color:var(--muted);font-weight:700}
.deck{font-size:13px;color:var(--muted)}.deck code{font-size:12px;background:var(--surface2);border-radius:6px;padding:2px 6px;word-break:break-all}
.path .go{margin-top:auto}
h2.sec{font-size:24px;margin:34px 0 12px}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}@media (max-width:900px){.how{grid-template-columns:1fr 1fr}}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}.how b{display:block;margin:4px 0}.how span{font-size:26px}.how p{margin:0;color:var(--muted);font-size:14px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--surface);border-radius:16px;overflow:hidden}
td{border-bottom:1px solid var(--line);padding:12px 14px;vertical-align:top;font-size:15px}td:first-child{font-weight:800;white-space:nowrap}
.rule{margin-top:18px;background:var(--red-soft);color:var(--ink);border-radius:16px;padding:14px 16px;font-weight:700}
.foot{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px}.foot a{color:var(--red);font-weight:800}
</style></head><body><div class="wrap" id="root"></div>
